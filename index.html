```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <div class="product-card">

            <img
                src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=85"
                alt="Red sports shoe"
                class="product-image"
            >

            <div class="product-info">
                <p class="category">SPORTS & FITNESS</p>

                <h1>Red Running Shoes</h1>

                <p class="description">
                    Lightweight and comfortable running shoes
                    designed for everyday adventures.
                </p>

                <p class="price">₹1,999</p>

                <button type="button" class="buy-button">
                    Buy Now →
                </button>
            </div>

        </div>
    </main>

</body>
</html>
